name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key (optional secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
        shell: bash
        run: gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build.log

      - name: Report build errors on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E '^(e: |FAILURE|\* What went wrong|> )' build.log | sed 's#file:///home/runner/work/Messages-app/Messages-app/##' | head -70; echo '```'; } > err.md
          gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha || github.sha }}/comments" -F body=@err.md

      - name: Name the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            { echo '```'; find app/build/outputs | head -30; echo ---; tail -45 build.log; echo '```'; } > err.md
            gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha || github.sha }}/comments" -F body=@err.md
            exit 1
          fi
          NAME="${{ github.ref_name == 'main' && 'latest' || github.ref_name }}"
          NAME="${NAME//\//-}"
          cp "$APK" "Messages-$NAME.apk"
          ls -la Messages-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: messages-apk
          path: Messages-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Messages-*.apk
          generate_release_notes: true
